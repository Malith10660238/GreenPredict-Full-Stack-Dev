name: green_predict
description: AI-powered agricultural platform for sustainable farming

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # State Management
  provider: ^6.1.1

  # API & HTTP
  http: ^1.1.0
  dio: ^5.3.4

  # Local Storage
  shared_preferences: ^2.2.2

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  google_sign_in: ^6.1.6
  cloud_firestore: ^4.13.6

  # Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Image Handling
  image_picker: ^1.1.2 # <-- CORRECTED AND PLACED HERE
  cached_network_image: ^3.3.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/